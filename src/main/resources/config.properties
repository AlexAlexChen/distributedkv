# DistributedKV Configuration Properties

# Node Configuration
node.id=node1
node.host=localhost
node.port=10000
node.data.dir=data

# Cluster Configuration
cluster.nodes=node1:localhost:10000,node2:localhost:10001,node3:localhost:10002
cluster.enable.sharding=true
cluster.num.shards=6
cluster.shard.migration.threads=2

# Raft Configuration
raft.election.timeout.ms=1000
raft.heartbeat.interval.ms=200
raft.snapshot.threshold=10000
raft.apply.batch.size=32
raft.log.dir=data/raft

# Read Optimization
raft.read.index.option=true
raft.follower.read.option=true
raft.leader.info.cache.time.ms=5000

# Write Optimization
raft.async.apply=true
raft.async.apply.threads=4
raft.async.apply.batch.size=32

# Storage Configuration
storage.engine=rocksdb
storage.db.path=data/db
storage.write.buffer.size.mb=64
storage.max.write.buffer.number=3
storage.target.file.size.mb=64
storage.max.bytes.for.level.base=512
storage.max.background.compactions=2
storage.max.background.flushes=2

# MVCC Configuration
storage.mvcc.enable=true
storage.mvcc.isolation.level=snapshot
storage.mvcc.gc.interval.ms=60000

# BTree Configuration (if used)
storage.btree.order=128
storage.btree.cache.size=1000

# HashTable Configuration (if used)
storage.hashtable.initial.capacity=1048576
storage.hashtable.load.factor=0.75
storage.hashtable.concurrency.level=16

# Network Configuration
network.timeout.ms=5000
network.connection.pool.size=16
network.max.frame.size.mb=64
network.compress.data=true

# Client Configuration
client.session.timeout.ms=30000
client.retry.max.attempts=3
client.retry.interval.ms=1000

# Performance Tuning
performance.thread.pool.size=32
performance.use.direct.buffers=true
performance.socket.receive.buffer.size=1048576
performance.socket.send.buffer.size=1048576

# Metrics Configuration
metrics.enable=true
metrics.report.interval.seconds=60
metrics.jmx.enable=true

# Security Configuration
security.enable.tls=false
security.keystore.path=config/keystore.jks
security.keystore.password=password
security.truststore.path=config/truststore.jks
security.truststore.password=password

# Advanced Configuration
advanced.enable.jvm.memory.tuning=true
advanced.heap.dump.on.oom=true
advanced.gc.log.path=logs/gc.log
