# DistributedKV Client Configuration

# Client identification
client.id=client1
client.request.timeout.ms=5000
client.connection.timeout.ms=3000
client.socket.timeout.ms=3000
client.max.retries=3
client.retry.interval.ms=1000
client.batch.size=100

# Server connection
server.addresses=localhost:10000,localhost:10001,localhost:10002
server.round.robin=true
server.auto.discover.nodes=true
server.discovery.interval.ms=60000

# Connection pool
connection.pool.size=16
connection.pool.min.idle=4
connection.pool.max.idle=8
connection.pool.max.wait.ms=2000
connection.test.on.borrow=true
connection.test.on.return=false
connection.test.while.idle=true
connection.min.evictable.idle.time.ms=300000

# Network settings
network.tcp.no.delay=true
network.buffer.size=8192
network.keep.alive=true

# Operation settings
operation.buffer.size=4096
operation.async.enabled=true
operation.async.thread.pool.size=4
operation.read.consistent=true
operation.read.from.follower=true
operation.write.sync=true
operation.default.ttl.seconds=0
operation.enable.compression=true

# Cache settings
cache.enabled=true
cache.size.mb=256
cache.expiry.seconds=300
cache.refresh.after.write=false
cache.statistics.enabled=true

# Performance settings
performance.metrics.enabled=true
performance.metrics.sample.interval.seconds=60
performance.batch.enabled=true

# Security settings
security.ssl.enabled=false
security.ssl.truststore=config/truststore.jks
security.ssl.truststore.password=password
security.authentication.enabled=false
security.username=
security.password=

# Logging settings
logging.level=INFO
logging.file=logs/client.log
logging.max.file.size=100MB
logging.max.files=5

# Debug settings
debug.enabled=false
debug.log.requests=false
debug.log.responses=false
debug.trace.operations=false
