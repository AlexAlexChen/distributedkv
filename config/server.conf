# DistributedKV Server Configuration

# Node configuration
node.id=node1
node.host=localhost
node.port=10000
node.data.dir=data
node.thread.pool.size=32

# Network configuration
network.timeout.ms=5000
network.max.connections=1000
network.buffer.size=8192
network.connect.timeout.ms=3000
network.so.timeout.ms=3000
network.tcp.no.delay=true
network.reuse.address=true

# Raft configuration
raft.election.timeout.ms=1000
raft.heartbeat.interval.ms=500
raft.snapshot.interval.seconds=3600
raft.max.log.entries.per.request=1000
raft.apply.batch.size=100
raft.follower.read.timeout.ms=1000
raft.enable.follower.read=true
raft.enable.async.apply=true
raft.pre.vote=true
raft.max.snapshot.concurrent=3
raft.log.sync.batch=true
raft.log.sync.interval.ms=10

# Storage configuration
storage.type=ROCKSDB
storage.rocksdb.max.open.files=1000
storage.rocksdb.block.size=4096
storage.rocksdb.block.cache.size.mb=512
storage.rocksdb.write.buffer.size.mb=64
storage.rocksdb.max.write.buffer.number=4
storage.rocksdb.compression=SNAPPY
storage.hashtable.buckets=1000000
storage.btree.order=128
storage.enable.mvcc=true
storage.mvcc.gc.interval.seconds=300

# Cluster configuration
cluster.seed.nodes=localhost:10000,localhost:10001,localhost:10002
cluster.shard.count=16
cluster.replication.factor=3
cluster.virtual.nodes.per.node=100
cluster.membership.timeout.ms=10000
cluster.auto.rebalance=true
cluster.min.nodes.for.write=2

# Performance tuning
performance.network.workers=4
performance.io.workers=8
performance.apply.workers=4
performance.metrics.sample.interval.seconds=60
performance.gc.log.enabled=true
performance.profiling.enabled=false

# Metrics and monitoring
metrics.enabled=true
metrics.jmx.enabled=true
metrics.prometheus.enabled=true
metrics.prometheus.port=9090
metrics.log.interval.seconds=300

# Logging configuration
logging.level=INFO
logging.file=logs/server.log
logging.max.file.size=100MB
logging.max.files=10
logging.async.queue.size=8192

# Security configuration
security.ssl.enabled=false
security.ssl.keystore=config/keystore.jks
security.ssl.keystore.password=password
security.ssl.truststore=config/truststore.jks
security.ssl.truststore.password=password
security.authentication.enabled=false
security.authorization.enabled=false

# Advanced configuration
advanced.enable.statistics=true
advanced.jvm.direct.memory.size.gb=4
advanced.jvm.heap.dump.on.oom=true
advanced.jvm.print.gc.details=true
advanced.force.leader.refresh.interval.seconds=60
