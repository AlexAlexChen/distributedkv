# DistributedKV Cluster Configuration

# Cluster identification
cluster.name=kv-cluster
cluster.id=cluster1
cluster.version=1.0

# Membership configuration
cluster.seed.nodes=localhost:10000,localhost:10001,localhost:10002
cluster.min.nodes=3
cluster.quorum.size=2
cluster.replication.factor=3
cluster.partition.count=16
cluster.virtual.nodes.per.node=100
cluster.node.timeout.ms=10000
cluster.membership.protocol=RAFT

# Data distribution
cluster.shard.strategy=CONSISTENT_HASH
cluster.shard.count=16
cluster.placement.strategy=RACK_AWARE
cluster.auto.rebalance=true
cluster.rebalance.threshold=0.1
cluster.max.rebalance.tasks=2
cluster.rebalance.batch.size=1000
cluster.rebalance.throttle.bytes.per.sec=10485760

# Failure detection
cluster.heartbeat.interval.ms=1000
cluster.failure.detection.interval.ms=5000
cluster.suspect.timeout.ms=10000
cluster.confirm.timeout.ms=15000
cluster.consensus.timeout.ms=20000

# Recovery
cluster.recovery.parallelism=2
cluster.recovery.batch.size=1000
cluster.recovery.throttle.bytes.per.sec=20971520
cluster.recovery.max.pending.requests=100
cluster.recovery.timeout.ms=300000

# Data migration
cluster.migration.threads=2
cluster.migration.batch.size=1000
cluster.migration.throttle.bytes.per.sec=10485760
cluster.migration.timeout.ms=600000
cluster.migration.max.concurrent=2

# Topology
topology.rack.aware=true
topology.network.topology=FLAT
topology.datacenter.aware=false
topology.zone.aware=false
topology.region.aware=false
topology.replication.cross.rack=true

# Consensus
consensus.protocol=RAFT
consensus.election.timeout.ms=1000
consensus.heartbeat.interval.ms=500
consensus.snapshot.interval.seconds=3600
consensus.max.log.entries.per.request=1000

# Monitoring
monitoring.enabled=true
monitoring.interval.ms=60000
monitoring.metrics.retention.hours=24
monitoring.alert.enabled=true
monitoring.alert.threshold.cpu=0.8
monitoring.alert.threshold.memory=0.8
monitoring.alert.threshold.disk=0.8
monitoring.alert.threshold.network=0.8

# Maintenance
maintenance.window.start=02:00
maintenance.window.duration.hours=2
maintenance.auto.snapshot=true
maintenance.snapshot.interval.hours=24
maintenance.compaction.interval.hours=6
maintenance.gc.interval.hours=24

# Security
security.acl.enabled=false
security.acl.file=config/acl.conf
security.internode.encryption=false
security.client.encryption=false

# Advanced
advanced.gossip.enabled=true
advanced.gossip.interval.ms=1000
advanced.gossip.fanout=3
advanced.enable.consistent.reads=true
advanced.enable.stale.reads=true
advanced.stale.read.tolerance.ms=5000
advanced.max.concurrent.rebalances=2
advanced.partition.aware.routing=true
